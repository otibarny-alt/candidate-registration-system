services:
  - type: web
    name: candidate-registration-portal
    env: python
    buildCommand: pip install -r requirements.txt && python verify_runtime.py
    startCommand: gunicorn app:app
    envVars:
      - key: MASTER_REGISTER_DATABASE_URL
        sync: false
      - key: MASTER_REGISTER_STRICT
        value: "true"
      - key: MEMBERSHIP_ASSET_UID
        sync: false
      - key: KOBO_API_TOKEN
        sync: false
      - key: MEMBERSHIP_CSV_FILENAME
        value: membership_registration.csv
      - key: SYSTEM_RESET_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: VOTING_SYSTEM_BASE_URL
        value: https://voting-simulation-system.onrender.com
      - key: VERIFICATION_SYSTEM_BASE_URL
        value: https://odm-member-photo-verifier.onrender.com
      - key: PRESIDENTIAL_RESULTS_URL
        value: https://presidential-simulation-results-dashboard.onrender.com
      - key: GUBERNATORIAL_RESULTS_URL
        value: https://gubernatorial-simulation-results-dashboard.onrender.com
      - key: SENATORIAL_RESULTS_URL
        value: https://senatorial-simulation-results-dashboard.onrender.com
      - key: WOMEN_REP_RESULTS_URL
        value: https://women-representative-simulation-results-dashboard.onrender.com
      - key: MNA_RESULTS_URL
        value: https://mna-simulation-results-dashboard.onrender.com
      - key: MCA_RESULTS_URL
        value: https://mca-simulation-results-dashboard.onrender.com
